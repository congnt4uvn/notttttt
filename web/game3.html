<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silly p5.js Playground</title>
  <style>
    html, body { margin: 0; overflow: hidden; background: #222; }
    canvas { display: block; }
    #menu {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; z-index: 10;
      max-width: 95vw;
      background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 16px;
    }
    #menu button {
      font: bold 14px sans-serif; padding: 8px 12px; border: 3px solid #000;
      border-radius: 12px; background: #fff; cursor: pointer;
    }
    #menu button:hover { background: #ffe14d; transform: rotate(-3deg) scale(1.08); }
    #menu button.active { background: #ff6fa5; color: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div id="menu">
    <button data-mode="face" class="active" onclick="setMode('face')">🤡 Silly Face</button>
    <button data-mode="whack" onclick="setMode('whack')">🔨 Whack-a-Clown</button>
    <button data-mode="runaway" onclick="setMode('runaway')">🏃 Runaway Button</button>
    <button data-mode="worm" onclick="setMode('worm')">🐛 Googly Worm</button>
    <button data-mode="disco" onclick="setMode('disco')">🕺 Disco Party</button>
    <button data-mode="monster" onclick="setMode('monster')">👾 Hungry Monster</button>
    <button data-mode="blob" onclick="setMode('blob')">🫠 Jelly Blob</button>
    <button data-mode="slime" onclick="setMode('slime')">💦 Slime Play</button>
  </div>
  <script>
    const EMOJIS = ['🤡', '💩', '🦆', '🍕', '🐸', '🥸', '🍌', '👻', '🦄', '🧀', '🐔', '🤪'];
    const CAPTIONS = [
      'Click me. I dare you.',
      'Ouch! Not the eyes!',
      'I am a very serious website.',
      'Boop!',
      'Too many clowns...',
      'Have you tried turning it off and on?',
      'Quack.',
      'Press SPACE for chaos',
      'My mom says I am handsome.',
      'Stop poking me!',
      'Pizza is a vegetable.'
    ];

    let things = [];
    let caption = CAPTIONS[0];
    let captionTimer = 0;
    let faceShake = 0;
    let tongue = 0;

    function setup() {
      createCanvas(windowWidth, windowHeight);
      textAlign(CENTER, CENTER);
      for (let i = 0; i < 8; i++) spawn(random(width), random(height / 2));
    }

    function windowResized() {
      resizeCanvas(windowWidth, windowHeight);
    }

    function spawn(x, y) {
      things.push({
        x, y,
        vx: random(-6, 6),
        vy: random(-12, -2),
        size: random(30, 70),
        rot: random(TWO_PI),
        vr: random(-0.2, 0.2),
        emoji: random(EMOJIS)
      });
      if (things.length > 150) things.shift();
    }

    function say(msg) {
      caption = msg;
      captionTimer = 180;
    }

    let mode = 'face';

    function setMode(m) {
      mode = m;
      document.querySelectorAll('#menu button').forEach(b => {
        b.classList.toggle('active', b.dataset.mode === m);
        b.blur();
      });
      if (m === 'whack') startWhack();
      else {
        cursor(ARROW);
        if (SCENES[m]) SCENES[m].start();
        else say('Welcome back, handsome.');
      }
    }

    function mousePressed(e) {
      if (e && e.target && e.target.tagName !== 'CANVAS') return;
      if (mode === 'whack') { whackClick(); return; }
      if (SCENES[mode]) { SCENES[mode].click(); return; }
      for (let i = 0; i < 5; i++) spawn(mouseX, mouseY);
      faceShake = 20;
      tongue = 30;
      say(random(CAPTIONS));
    }

    function keyPressed() {
      if (mode === 'face' && key === ' ') {
        for (let i = 0; i < 40; i++) spawn(random(width), random(height));
        faceShake = 40;
        say('CHAOS MODE!!!');
        return false;
      }
    }

    function draw() {
      if (mode === 'whack') { drawWhack(); return; }
      if (SCENES[mode]) { SCENES[mode].draw(); return; }

      // rainbow wobbling background
      colorMode(HSB, 360, 100, 100);
      background((frameCount * 0.5) % 360, 40, 95);
      colorMode(RGB, 255);

      updateThings();
      drawFace();
      drawCaption();
    }

    function updateThings() {
      textSize(40);
      for (const t of things) {
        t.vy += 0.5;
        t.x += t.vx;
        t.y += t.vy;
        t.rot += t.vr;

        // mouse repels things (they are scared)
        const d = dist(mouseX, mouseY, t.x, t.y);
        if (d < 100) {
          t.vx += (t.x - mouseX) * 0.02;
          t.vy += (t.y - mouseY) * 0.02;
        }

        if (t.x < 0 || t.x > width) { t.vx *= -0.9; t.x = constrain(t.x, 0, width); }
        if (t.y > height) { t.vy *= -0.85; t.y = height; }

        push();
        translate(t.x, t.y);
        rotate(t.rot);
        textSize(t.size);
        text(t.emoji, 0, 0);
        pop();
      }
    }

    function drawFace() {
      const cx = width / 2 + random(-faceShake, faceShake);
      const cy = height / 2 + random(-faceShake, faceShake);
      const r = min(width, height) * 0.28;
      faceShake = max(0, faceShake - 1);
      tongue = max(0, tongue - 1);

      // head
      stroke(0);
      strokeWeight(6);
      fill(255, 220, 60);
      ellipse(cx, cy, r * 2 + sin(frameCount * 0.1) * 10, r * 2 - sin(frameCount * 0.1) * 10);

      // googly eyes that follow the mouse
      for (const side of [-1, 1]) {
        const ex = cx + side * r * 0.4;
        const ey = cy - r * 0.25;
        const er = r * 0.28;
        fill(255);
        ellipse(ex, ey, er * 2);
        const angle = atan2(mouseY - ey, mouseX - ex);
        const dist_ = min(er * 0.5, dist(mouseX, mouseY, ex, ey) * 0.2);
        fill(0);
        noStroke();
        ellipse(ex + cos(angle) * dist_, ey + sin(angle) * dist_, er * 0.8);
        stroke(0);
      }

      // mouth opens when mouse is close
      const mouseDist = dist(mouseX, mouseY, cx, cy);
      const open = map(constrain(mouseDist, 0, r * 2), r * 2, 0, 0.1, 1);
      fill(150, 0, 30);
      ellipse(cx, cy + r * 0.45, r * 0.9, r * 0.9 * open);

      if (tongue > 0 || open > 0.6) {
        fill(255, 90, 120);
        ellipse(cx, cy + r * 0.45 + r * 0.45 * open * 0.5, r * 0.3, r * 0.4 * open);
      }

      // silly unibrow
      noFill();
      strokeWeight(10);
      const browLift = sin(frameCount * 0.15) * 6;
      arc(cx, cy - r * 0.62 + browLift, r * 1.1, r * 0.3, PI, TWO_PI);
    }

    function drawCaption() {
      if (captionTimer > 0) captionTimer--;
      else if (frameCount % 300 === 0) say(random(CAPTIONS));

      textSize(32);
      noStroke();
      fill(0, 150);
      rect(width / 2 - textWidth(caption) / 2 - 20, 30, textWidth(caption) + 40, 56, 14);
      fill(255);
      text(caption, width / 2, 58);
    }

    // ---------- Whack-a-Clown ----------
    const BONKS = ['BONK!', 'HONK!', 'Ow, my nose!', 'Sent to the circus!', 'Take that, Bozo!', 'SPLAT!'];
    const ESCAPES = ['He got away!', 'Too slow, grandma!', 'The clown laughs at you.', 'Wake up!'];
    let holes = [];
    let score = 0;
    let escaped = 0;
    let hammer = 0;

    function startWhack() {
      holes = Array.from({ length: 9 }, () => ({ up: 0, hit: 0 }));
      score = 0;
      escaped = 0;
      say('Whack the clowns!');
    }

    function holePos(i) {
      const s = min(width, height) * 0.26;
      return { x: width / 2 + ((i % 3) - 1) * s, y: height / 2 + (floor(i / 3) - 1) * s * 0.85 + s * 0.1, s };
    }

    function whackClick() {
      hammer = 8;
      for (let i = 0; i < holes.length; i++) {
        const p = holePos(i);
        if (holes[i].up > 0 && dist(mouseX, mouseY, p.x, p.y - p.s * 0.2) < p.s * 0.4) {
          holes[i].up = 0;
          holes[i].hit = 25;
          score++;
          say(random(BONKS));
          return;
        }
      }
    }

    function drawWhack() {
      background(90, 180, 90);
      if (holes.length === 0) startWhack();

      // clowns pop up faster as the score grows
      if (frameCount % max(15, 40 - score) === 0) {
        const h = random(holes);
        if (h.up === 0 && h.hit === 0) h.up = floor(random(50, 90));
      }

      textAlign(CENTER, CENTER);
      for (let i = 0; i < holes.length; i++) {
        const h = holes[i];
        const p = holePos(i);

        if (h.up > 0) {
          h.up--;
          if (h.up === 0) { escaped++; say(random(ESCAPES)); }
        }
        if (h.hit > 0) h.hit--;

        noStroke();
        fill(60, 35, 20);
        ellipse(p.x, p.y + p.s * 0.1, p.s * 0.8, p.s * 0.35);

        const rise = h.up > 0 ? min(1, (h.up) / 10, 1) : 0;
        if (h.up > 0) {
          textSize(p.s * 0.6);
          text('🤡', p.x + sin(frameCount * 0.5) * 3, p.y - p.s * 0.2 * rise);
        } else if (h.hit > 0) {
          textSize(p.s * 0.6);
          text('💥', p.x, p.y - p.s * 0.2);
        }

        // front lip of the hole hides the clown's bottom
        fill(90, 180, 90);
        rect(p.x - p.s * 0.45, p.y + p.s * 0.12, p.s * 0.9, p.s * 0.3);
        fill(60, 35, 20);
        arc(p.x, p.y + p.s * 0.12, p.s * 0.8, p.s * 0.35, 0, PI);
      }

      // HUD
      textSize(32);
      fill(0, 150);
      rect(width / 2 - 200, 30, 400, 56, 14);
      fill(255);
      text('Bonked: ' + score + '   Escaped: ' + escaped, width / 2, 58);

      textSize(26);
      fill(0, 150);
      rect(width / 2 - textWidth(caption) / 2 - 20, 100, textWidth(caption) + 40, 46, 12);
      fill(255);
      text(caption, width / 2, 123);

      // hammer cursor
      noCursor();
      push();
      translate(mouseX, mouseY);
      rotate(hammer > 0 ? -0.9 : 0);
      textSize(60);
      text('🔨', 0, 0);
      pop();
      if (hammer > 0) hammer--;
    }

    // ---------- More funnies ----------
    const SCENES = {};

    function hud(msg, y, size) {
      textAlign(CENTER, CENTER);
      textSize(size || 28);
      noStroke();
      const w = textWidth(msg) + 40;
      fill(0, 150);
      rect(width / 2 - w / 2, y, w, 50, 14);
      fill(255);
      text(msg, width / 2, y + 25);
    }

    function googlyEye(x, y, r, tx, ty) {
      stroke(0);
      strokeWeight(3);
      fill(255);
      ellipse(x, y, r * 2);
      const a = atan2(ty - y, tx - x);
      const d = min(r * 0.5, dist(tx, ty, x, y) * 0.2);
      noStroke();
      fill(0);
      ellipse(x + cos(a) * d, y + sin(a) * d, r * 0.9);
    }

    // 1. Runaway Button
    SCENES.runaway = {
      taunts: ['Too slow!', 'Nope!', 'Haha, missed!', 'Try harder!', 'Is that all you got?', 'Catch me if you can!', 'I am scared of you!'],
      start() {
        this.w = 240; this.h = 90;
        this.bx = width / 2; this.by = height / 2;
        this.tries = 0; this.wins = 0;
        say('Go on. Click the button.');
      },
      teleport() {
        this.bx = random(this.w, width - this.w);
        this.by = random(160, height - 140);
        this.tries++;
      },
      draw() {
        background(40, 40, 90);
        const dx = this.bx - mouseX, dy = this.by - mouseY;
        const d = max(1, sqrt(dx * dx + dy * dy));
        if (d < 220) {
          const p = (220 - d) * 0.25;
          this.bx += dx / d * p;
          this.by += dy / d * p;
        }
        const minX = this.w / 2 + 20, maxX = width - this.w / 2 - 20;
        const minY = 150, maxY = height - 130;
        const cornered = this.bx < minX || this.bx > maxX || this.by < minY || this.by > maxY;
        this.bx = constrain(this.bx, minX, maxX);
        this.by = constrain(this.by, minY, maxY);
        if (cornered && d < 120) {
          this.teleport();
          say(random(this.taunts));
        }

        push();
        translate(this.bx, this.by);
        rotate(sin(frameCount * 0.2) * 0.05);
        rectMode(CENTER);
        fill(255, 80, 100);
        stroke(255);
        strokeWeight(5);
        rect(0, 0, this.w, this.h, 20);
        noStroke();
        fill(255);
        textSize(34);
        text('CLICK ME', 0, 0);
        pop();

        hud(caption, 30);
        hud('Dodges: ' + this.tries + '   Lucky clicks: ' + this.wins, 90, 20);
      },
      click() {
        if (abs(mouseX - this.bx) < this.w / 2 && abs(mouseY - this.by) < this.h / 2) {
          this.wins++;
          say('IMPOSSIBLE! You clicked it!');
          this.teleport();
        } else {
          say(random(this.taunts));
        }
      }
    };

    // 2. Googly Worm
    SCENES.worm = {
      quotes: ['I am Wiggles!', 'Do not step on me.', 'I have no legs and I must wiggle.', 'Wanna see me squirm?', 'Worm life is the best life.', 'Boing!'],
      start() {
        this.segs = Array.from({ length: 30 }, () => ({ x: width / 2, y: height / 2 }));
        this.pulse = 0;
        say('I am Wiggles the worm. Move your mouse!');
      },
      draw() {
        background(120, 200, 255);
        noStroke();
        fill(80, 170, 80);
        rect(0, height - 100, width, 100);

        const s = this.segs;
        s[0].x = lerp(s[0].x, mouseX, 0.12);
        s[0].y = lerp(s[0].y, mouseY, 0.12);
        for (let i = 1; i < s.length; i++) {
          const a = atan2(s[i].y - s[i - 1].y, s[i].x - s[i - 1].x);
          s[i].x = s[i - 1].x + cos(a) * 18;
          s[i].y = s[i - 1].y + sin(a) * 18;
        }

        colorMode(HSB, 360, 100, 100);
        stroke(0);
        strokeWeight(3);
        for (let i = s.length - 1; i >= 0; i--) {
          fill((i * 12 + frameCount * 2) % 360, 70, 100);
          const size = map(i, 0, s.length, 44, 14) + this.pulse;
          ellipse(s[i].x, s[i].y + sin(frameCount * 0.2 - i * 0.5) * 6, size);
        }
        colorMode(RGB, 255);

        const hx = s[0].x, hy = s[0].y;
        const tx = mouseX + cos(frameCount * 0.1) * 120, ty = mouseY + sin(frameCount * 0.13) * 120;
        googlyEye(hx - 12, hy - 12, 10, tx, ty);
        googlyEye(hx + 12, hy - 12, 10, tx, ty);
        noFill();
        stroke(0);
        strokeWeight(3);
        arc(hx, hy + 6, 24, 16, 0, PI);

        this.pulse = max(0, this.pulse - 1);
        hud(caption, 30);
      },
      click() {
        this.pulse = 20;
        say(random(this.quotes));
      }
    };

    // 3. Disco Party
    SCENES.disco = {
      emojis: ['🕺', '💃', '🐔', '🦆', '🤡', '👽', '🐸', '🦄', '🧓'],
      start() {
        this.dancers = [];
        for (let i = 0; i < 6; i++) this.add(random(width), random(height * 0.35, height * 0.75));
        say('Party time!');
      },
      add(x, y) {
        this.dancers.push({ x, y, ph: random(TWO_PI), e: random(this.emojis) });
        if (this.dancers.length > 40) this.dancers.shift();
      },
      draw() {
        const beat = floor(frameCount / 15);
        const t = 70;
        colorMode(HSB, 360, 100, 100);
        noStroke();
        for (let gx = 0; gx < width; gx += t) {
          for (let gy = 0; gy < height; gy += t) {
            const i = gx / t, j = gy / t;
            const alt = (i + j + beat) % 2;
            fill((beat * 40 + i * 30 + j * 20 + alt * 180) % 360, 80, alt ? 100 : 55);
            rect(gx, gy, t, t);
          }
        }
        colorMode(RGB, 255);

        stroke(255);
        strokeWeight(3);
        line(width / 2, 0, width / 2, 80);
        fill(210);
        ellipse(width / 2, 120, 110);
        noStroke();
        for (let i = 0; i < 10; i++) {
          fill(255, random(150, 255));
          ellipse(width / 2 + random(-45, 45), 120 + random(-45, 45), random(4, 10));
        }

        for (const d of this.dancers) {
          const w = sin(frameCount * 0.25 + d.ph);
          push();
          translate(d.x, d.y + w * 25);
          rotate(w * 0.35);
          textSize(60 + w * 10);
          text(d.e, 0, 0);
          pop();
        }
        hud(caption, 30);
      },
      click() {
        this.add(mouseX, mouseY);
        say(random(['Another dancer joins!', 'Shake it!', 'Do the chicken!', 'DJ drop the beat!']));
      }
    };

    // 4. Hungry Monster
    SCENES.monster = {
      food: ['🍕', '🍔', '🍟', '🌮', '🍩', '🍗'],
      bad: ['🧦', '👟', '🥦', '🧽'],
      yum: ['Nom nom!', 'Delicious!', 'More!', 'Pizza time!', 'Tasty!'],
      eww: ['EWWW, a sock!', 'Yuck!', 'Who put that there?!', 'Blech!'],
      start() {
        this.mx = width / 2;
        this.items = [];
        this.score = 0;
        this.ew = 0;
        this.burp = 0;
        say('FEED ME!');
      },
      draw() {
        background(255, 200, 120);
        const my = height - 230;
        this.mx = lerp(this.mx, mouseX, 0.15);

        if (frameCount % max(12, 30 - this.score) === 0) {
          const bad = random() < 0.3;
          this.items.push({ x: random(60, width - 60), y: -40, vy: random(3, 7), bad, e: random(bad ? this.bad : this.food) });
        }

        textSize(50);
        for (let i = this.items.length - 1; i >= 0; i--) {
          const it = this.items[i];
          it.y += it.vy;
          if (abs(it.x - this.mx) < 80 && abs(it.y - (my - 20)) < 50) {
            if (it.bad) {
              this.ew = 30;
              this.score = max(0, this.score - 1);
              say(random(this.eww));
            } else {
              this.score++;
              this.burp = 15;
              say(random(this.yum));
            }
            this.items.splice(i, 1);
            continue;
          }
          if (it.y > height + 40) { this.items.splice(i, 1); continue; }
          text(it.e, it.x, it.y);
        }

        const mx = this.mx;
        noStroke();
        fill(this.ew > 0 ? color(120, 200, 80) : color(150, 80, 200));
        triangle(mx - 80, my - 20, mx - 50, my - 90, mx - 30, my - 40);
        triangle(mx + 80, my - 20, mx + 50, my - 90, mx + 30, my - 40);
        ellipse(mx, my + 40, 200 + this.burp * 2, 200);
        googlyEye(mx - 40, my - 20, 20, mouseX, mouseY);
        googlyEye(mx + 40, my - 20, 20, mouseX, mouseY);
        noStroke();
        fill(60, 0, 40);
        const mh = 50 + this.burp * 3 + sin(frameCount * 0.2) * 8;
        ellipse(mx, my + 40, 110 + this.burp * 4, mh);
        fill(255);
        for (let k = -2; k <= 2; k++) {
          triangle(mx + k * 20 - 8, my + 40 - mh / 2 + 2, mx + k * 20 + 8, my + 40 - mh / 2 + 2, mx + k * 20, my + 40 - mh / 2 + 16);
        }
        this.ew = max(0, this.ew - 1);
        this.burp = max(0, this.burp - 1);

        hud(caption, 30);
        hud('Snacks eaten: ' + this.score, 90, 20);
      },
      click() {
        this.burp = 30;
        say('BUUUURP!');
      }
    };

    // 5. Jelly Blob
    SCENES.blob = {
      giggles: ['Hehehe, that tickles!', 'Boing!', 'Wobble wobble!', 'I am 100% jelly.', 'Do not poke Gerald!'],
      start() {
        this.x = width / 2; this.y = height / 2;
        this.vx = 0; this.vy = 0;
        this.giggle = 0;
        say('I am Gerald the jelly.');
      },
      draw() {
        background(255, 240, 200);
        this.vx = (this.vx + (mouseX - this.x) * 0.02) * 0.92;
        this.vy = (this.vy + (mouseY - this.y) * 0.02) * 0.92;
        this.x += this.vx;
        this.y += this.vy;

        const sp = sqrt(this.vx * this.vx + this.vy * this.vy);
        const ang = atan2(this.vy, this.vx);
        const s = min(sp * 0.03, 0.7);
        const base = min(width, height) * 0.16 + (this.giggle > 0 ? sin(frameCount * 1.2) * 8 : 0);

        fill(this.giggle > 0 ? color(255, 140, 200) : color(80, 220, 160));
        stroke(30, 120, 90);
        strokeWeight(6);
        beginShape();
        for (let a = 0; a < TWO_PI; a += 0.15) {
          const r = base * (1 + 0.08 * sin(a * 5 + frameCount * 0.15));
          const lx = cos(a) * r * (1 + s), ly = sin(a) * r / (1 + s);
          vertex(this.x + lx * cos(ang) - ly * sin(ang), this.y + lx * sin(ang) + ly * cos(ang));
        }
        endShape(CLOSE);

        googlyEye(this.x - base * 0.3, this.y - base * 0.15, base * 0.18, mouseX, mouseY);
        googlyEye(this.x + base * 0.3, this.y - base * 0.15, base * 0.18, mouseX, mouseY);
        if (this.giggle > 0) {
          noStroke();
          fill(120, 0, 40);
          ellipse(this.x, this.y + base * 0.3, base * 0.5, base * 0.35);
        } else {
          noFill();
          stroke(30, 120, 90);
          strokeWeight(5);
          arc(this.x, this.y + base * 0.15, base * 0.5, base * 0.35, 0, PI);
        }
        this.giggle = max(0, this.giggle - 1);
        hud(caption, 30);
      },
      click() {
        this.giggle = 40;
        this.vy -= 20;
        say(random(this.giggles));
      }
    };

    // 6. Slime Play
    SCENES.slime = {
      hues: [110, 320, 190, 270, 55],
      lines: ['Squish!', 'Ew, so gooey!', 'Splorch!', 'Slimy fingers!', 'It is alive!', 'Do not eat it.', 'Schlorp!'],
      start() {
        this.p = [];
        this.hue = random(this.hues);
        this.pouring = false;
        say('Hold the mouse to pour slime. Move it to poke!');
      },
      add(x, y, vx, vy) {
        this.p.push({ x, y, vx, vy, r: random(14, 26), h: this.hue + random(-10, 10), fy: random(0, 45), eye: random() < 0.06, floor: false });
        if (this.p.length > 600) this.p.shift();
      },
      draw() {
        background(30, 25, 50);
        const floorY = height - 110;
        if (!mouseIsPressed) this.pouring = false;
        if (this.pouring) {
          for (let i = 0; i < 2; i++) this.add(mouseX + random(-10, 10), mouseY, random(-1.5, 1.5), random(0, 2));
        }

        const mvx = mouseX - pmouseX, mvy = mouseY - pmouseY;
        const poking = !this.pouring && abs(mvx) + abs(mvy) > 2;
        let poked = false;
        for (const p of this.p) {
          p.vy += 0.5;
          if (poking && dist(mouseX, mouseY, p.x, p.y) < 70) {
            p.vx += mvx * 0.15;
            p.vy += mvy * 0.15;
            poked = true;
          }
          p.vx = constrain(p.vx, -14, 14);
          p.vy = constrain(p.vy, -14, 14);
          p.x += p.vx;
          p.y += p.vy;
          const fl = floorY - p.fy;
          if (p.y > fl) {
            p.y = fl;
            p.vy *= -0.2;
            p.vx = p.vx * 0.85 + random(-0.3, 0.3);
            p.floor = true;
          } else {
            p.floor = false;
          }
          if (p.x < 0 || p.x > width) { p.x = constrain(p.x, 0, width); p.vx *= -0.5; }
        }
        if (poked && frameCount % 40 === 0) say(random(this.lines));

        const squash = (p) => p.floor ? 0.5 : min(0.3, sqrt(p.vx * p.vx + p.vy * p.vy) * 0.03);

        colorMode(HSB, 360, 100, 100);
        noStroke();
        for (const p of this.p) {
          const sq = squash(p);
          fill(p.h % 360, 85, 55);
          ellipse(p.x, p.y, p.r * 2 * (1 + sq) + 10, p.r * 2 * (1 - sq * 0.5) + 10);
        }
        for (const p of this.p) {
          const sq = squash(p);
          fill(p.h % 360, 60, 95);
          ellipse(p.x, p.y, p.r * 2 * (1 + sq), p.r * 2 * (1 - sq * 0.5));
        }
        fill(0, 0, 100, 0.5);
        for (const p of this.p) ellipse(p.x - p.r * 0.3, p.y - p.r * 0.3, p.r * 0.5, p.r * 0.3);
        colorMode(RGB, 255);

        for (const p of this.p) {
          if (p.eye) googlyEye(p.x, p.y, p.r * 0.5, mouseX, mouseY);
        }

        hud(caption, 30);
      },
      click() {
        this.pouring = true;
        this.hue = random(this.hues);
        for (let i = 0; i < 20; i++) {
          const a = random(TWO_PI), s = random(4, 10);
          this.add(mouseX, mouseY, cos(a) * s, sin(a) * s - 3);
        }
        say(random(this.lines));
      }
    };
  </script>
